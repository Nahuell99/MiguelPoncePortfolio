<div class="bar">
  <a class="brand" href="#inicio" (click)="closeMenu()" aria-label="Miguel Ponce, ir al inicio">
    <span class="logo" aria-hidden="true"><img src="logo.png" alt="" width="109" height="72" /></span>
    <span>
      <strong>Miguel Ponce</strong>
      <small>Mantenimiento y servicios</small>
    </span>
  </a>

  <nav id="site-nav" aria-label="Secciones">
    @for (item of site.nav; track item.id) {
      <a [href]="'#' + item.id" (click)="closeMenu()">{{ item.label }}</a>
    }
    <a class="nav-wa" [href]="site.whatsappUrl" target="_blank" rel="noopener noreferrer" (click)="closeMenu()">
      <app-icon name="whatsapp" [size]="20" />
      Escribime por WhatsApp
    </a>
  </nav>

  <a class="phone-btn" [href]="site.phoneTel">
    <app-icon name="phone" [size]="18" />
    {{ site.phoneDisplay }}
  </a>

  <button
    type="button"
    class="menu-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="site-nav"
    (click)="toggleMenu()"
  >
    <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
    <span class="burger" aria-hidden="true"></span>
  </button>
</div>
