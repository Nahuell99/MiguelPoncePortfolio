<section id="planes" class="plans">
  <div class="container">
    <div class="head" appReveal>
      <h2 class="title">{{ site.plans.title }}</h2>
      <p class="lede">{{ site.plans.text }}</p>
    </div>

    <div class="grid" appReveal>
      @for (plan of site.plans.items; track plan.title) {
        <article class="panel">
          <span class="ic" aria-hidden="true"><app-icon [name]="plan.icon" [size]="26" /></span>
          <h3>{{ plan.title }}</h3>
          <p>{{ plan.text }}</p>
        </article>
      }
      <article class="panel featured">
        <span class="ic" aria-hidden="true"><app-icon [name]="site.plans.subscription.icon" [size]="26" /></span>
        <h3>{{ site.plans.subscription.title }}</h3>
        <p>{{ site.plans.subscription.text }}</p>
        <a class="btn btn-navy" [href]="site.plans.subscription.href" target="_blank" rel="noopener noreferrer">
          <app-icon name="whatsapp" [size]="20" />
          {{ site.plans.subscription.cta }}
        </a>
      </article>
    </div>
  </div>
</section>
