<footer>
  <div class="container grid">
    <div class="brand">
      <strong>{{ site.brand }}</strong>
      <p>Plomería, gas, electricidad, herrería y mantenimiento general en {{ site.area }}.</p>
    </div>

    <nav aria-label="Secciones del pie">
      @for (item of site.nav; track item.id) {
        <a [href]="'#' + item.id">{{ item.label }}</a>
      }
    </nav>

    <div class="reach">
      <a [href]="site.whatsappUrl" target="_blank" rel="noopener noreferrer">
        <app-icon name="whatsapp" [size]="20" />
        {{ site.phoneDisplay }}
      </a>
      <a [href]="site.emailHref">
        <app-icon name="mail" [size]="20" />
        {{ site.email }}
      </a>
    </div>
  </div>
  <p class="copy container">© {{ site.year }} {{ site.legalName }}</p>
</footer>

<div class="mobile-bar" role="group" aria-label="Contacto rápido">
  <a class="call" [href]="site.phoneTel">
    <app-icon name="phone" [size]="20" />
    Llamar
  </a>
  <a class="wa" [href]="site.whatsappUrl" target="_blank" rel="noopener noreferrer">
    <app-icon name="whatsapp" [size]="22" />
    WhatsApp
  </a>
</div>
