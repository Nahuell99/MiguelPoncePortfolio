<section id="contacto" class="contact">
  <div class="container">
    <div class="card" appReveal>
      <div class="copy">
        <h2 class="title">{{ site.contact.title }}</h2>
        <p class="lede">{{ site.contact.text }}</p>
      </div>

      <div class="ways">
        <a class="way way-wa" [href]="site.whatsappUrl" target="_blank" rel="noopener noreferrer">
          <span class="ic" aria-hidden="true"><app-icon name="whatsapp" [size]="24" /></span>
          <span>
            <strong>WhatsApp</strong>
            <small>Mandame fotos del problema</small>
          </span>
        </a>
        <a class="way" [href]="site.phoneTel">
          <span class="ic" aria-hidden="true"><app-icon name="phone" [size]="22" /></span>
          <span>
            <strong>{{ site.phoneDisplay }}</strong>
            <small>Llamar ahora</small>
          </span>
        </a>
        <a class="way" [href]="site.emailHref">
          <span class="ic" aria-hidden="true"><app-icon name="mail" [size]="22" /></span>
          <span>
            <strong class="mail">{{ site.emailUser }}&#64;<wbr />{{ site.emailDomain }}</strong>
            <small>Para presupuestos de obra</small>
          </span>
        </a>
      </div>
    </div>
  </div>
</section>
