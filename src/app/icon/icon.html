@if (isMaterial()) {
  <span class="material" [style.font-size.px]="size()" aria-hidden="true">{{ name() }}</span>
} @else {
<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('phone') {
      <path d="M6.5 3.5h3l1.5 3.5-2 1.2a12 12 0 0 0 5.8 5.8l1.2-2 3.5 1.5v3a2 2 0 0 1-2 2A14 14 0 0 1 4.5 5.5a2 2 0 0 1 2-2z" />
    }
    @case ('check') {
      <circle cx="12" cy="12" r="8" />
      <path d="m8.5 12 2.5 2.5 4.5-5" />
    }
    @case ('medal') {
      <circle cx="12" cy="9" r="4.5" />
      <path d="m9 13.2-1.2 7.3L12 18l4.2 2.5L15 13.2" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="8" />
      <path d="M12 8v4.2L15 15" />
    }
    @case ('chat') {
      <path d="M5 6.5h12.5A1.5 1.5 0 0 1 19 8v6.5a1.5 1.5 0 0 1-1.5 1.5H10l-3.5 3v-3H5A1.5 1.5 0 0 1 3.5 14.5V8A1.5 1.5 0 0 1 5 6.5z" />
    }
    @case ('shield') {
      <path d="M12 3 19 6v6c0 4.2-3 6.8-7 8-4-1.2-7-3.8-7-8V6l7-3z" />
    }
    @case ('wrench') {
      <path d="M14.7 6.2a3.4 3.4 0 0 0-4.6 4.1L4.2 16.2 7.8 19.8l5.9-5.9a3.4 3.4 0 0 0 4.1-4.6L15 12.2 11.8 9z" />
    }
    @case ('calendar') {
      <rect x="4" y="5" width="16" height="15" rx="2" />
      <path d="M8 3.5v4M16 3.5v4M4 10h16" />
    }
    @case ('users') {
      <circle cx="9" cy="9" r="3" />
      <circle cx="16.2" cy="10" r="2.3" />
      <path d="M4.2 19c.6-2.7 2.6-4 4.8-4s4.2 1.3 4.8 4" />
      <path d="M14 15.1c1.5-.4 3.1-.2 4.3 1 .9 1 1.3 2.2 1.5 2.9" />
    }
    @case ('headset') {
      <path d="M5 13a7 7 0 0 1 14 0" />
      <path d="M5 13v4a2 2 0 0 0 2 2h1v-6H7a2 2 0 0 0-2 2z" />
      <path d="M19 13v4a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2z" />
    }
    @case ('clipboard') {
      <rect x="6" y="4" width="12" height="16" rx="2" />
      <path d="M9 4.2h6V7H9zM9 11h6M9 15h4" />
    }
    @case ('pin') {
      <path d="M12 21s6-5.1 6-10a6 6 0 1 0-12 0c0 4.9 6 10 6 10z" />
      <circle cx="12" cy="11" r="2" />
    }
    @case ('whatsapp') {
      <path d="M6 17.5 7.3 14.2A6.4 6.4 0 1 1 10.2 18L6 17.5z" />
      <path d="M9.2 10.4c.3 1.8 1.9 3.1 3.6 3.4" />
    }
  }
</svg>
}
